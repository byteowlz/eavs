[package]
name = "eavs-console-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless core of the eavs console: instance registry, operator API client, provider presets and view models (no gpui)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
toml = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
