# Release config consumed by `byt release` (ADR-0021).
# The reusable workflow builds linux-gnu in the byt container (glibc floor) and
# *-apple-darwin natively on a macOS runner, then combines + publishes.
[release]
name = "eavs"
lang = "rust"
bins = ["eavs"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[release.homebrew]
formula = "eavs"

[release.aur]
pkgname = "eavs"
pkgdesc = "Unified API gateway for LLM providers with virtual API keys and usage tracking"
license = "MIT"
url = "https://github.com/byteowlz/eavs"
depends = ["gcc-libs"]
