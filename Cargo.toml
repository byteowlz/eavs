[package]
name = "eavs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
uuid = { version = "1", features = ["v4", "fast-rng"] }
bytes = "1"
futures = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
once_cell = "1.19"
dashmap = "5.5" # For concurrent state map
tokio-stream = { version = "0.1.17", features = ["sync"] }

# Virtual API Keys
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tiktoken-rs = "0.6"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
governor = "0.8" # Rate limiting
glob-match = "0.2" # For model pattern matching
toml = "0.8" # For word lists parsing
ureq = "2.10" # For synchronous HTTP (word lists download)
url = "2" # For URL parsing in CLI
libc = "0.2.178"
