[package]
name = "eavs"
version = "0.9.0"
edition = "2021"
license = "MIT"

[dependencies]
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ratatui = "0.30"
crossterm = "0.29"
byteowlz-tui-kit = { git = "https://github.com/byteowlz/xlatch.git", rev = "783568c6d55e582fe535405627670ffaa72d8deb" }
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
uuid = { version = "1", features = ["v4", "fast-rng"] }
bytes = "1"
futures = "0.3"
tokio-tungstenite = "0.24"
http = "1"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
once_cell = "1.19"
dashmap = "5.5" # For concurrent state map
tokio-stream = { version = "0.1.17", features = ["sync"] }

# Virtual API Keys
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tiktoken-rs = "0.6"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
governor = "0.8" # Rate limiting
glob-match = "0.2" # For model pattern matching
toml = "0.8" # For word lists parsing
ureq = "2.10" # For synchronous HTTP (word lists download)
url = "2" # For URL parsing in CLI
libc = "0.2.178"
# Linux uses the kernel keyutils backend (`linux-native`) rather than the D-Bus
# secret-service backend: `sync-secret-service` pulls `libdbus-sys`, a target-
# linked C lib that can't cross-compile under zig, and the D-Bus daemon isn't
# present in headless/container deploys anyway. When no OS keyring is reachable,
# OAuth/API-key storage falls back to sqlite (see src/oauth/storage.rs).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rpassword = "7"
async-trait = "0.1"
dialoguer = "0.11"
zstd = "0.13.3"

tempfile = "3.23.0"

[features]
integration = []

# Template maximum policy, staged for this existing codebase:
# Keep debt visible as warnings in ordinary builds/tests so source remediation
# can proceed separately. `just clippy`/CI promote ALL warnings to errors; there
# is no passing baseline or suppression list. Once debt is resolved, promote
# these levels to deny (unsafe_code to forbid, after reviewing capture.rs).
# Existing debt includes public API docs, test unwraps, libc unsafe, process
# exits, complexity and source allow attributes. No source files are excluded.
[lints.rust]
unsafe_code = "warn"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
unfulfilled_lint_expectations = "warn"

[lints.rustdoc]
all = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
await_holding_lock = "warn"
large_futures = "warn"
exit = "warn"
mem_forget = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
cognitive_complexity = "warn"
# The template's cyclomatic_complexity alias is deprecated; cognitive_complexity
# is its replacement and uses the threshold in clippy.toml.

# Template exceptions retained with their original scope, not debt suppressions.
multiple_crate_versions = "allow" # Transitive dependency graphs require duplicates.
cast_possible_truncation = "allow" # Template numeric-cast policy.
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
print_stdout = "allow" # CLI output is intentional.
print_stderr = "allow"
struct_excessive_bools = "allow" # CLI option structs contain boolean flags.
