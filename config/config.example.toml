# yaml-language-server: $schema=config.schema.json
# EAVS Configuration Example
# Enhanced AI Validation System
#
# Copy this file to one of these locations:
#   - ~/.config/eavs/config.toml (global)
#   - ./eavs.toml (local, overrides global)
#
# Or point EAVS at an explicit config file:
#   - eavs serve --config /path/to/config.toml
#   - EAVS_CONFIG=/path/to/config.toml eavs serve
#
# For schema validation and autocompletion in your editor, ensure the
# JSON schema reference above is recognized (works with taplo and other TOML LSPs).

[server]
host = "127.0.0.1"
port = 3000

# =============================================================================
# Providers
# =============================================================================
# Configure multiple LLM providers. Use X-Provider header to select at runtime.
# All api_key values support "env:VAR_NAME" syntax to read from environment.

# OpenAI (default provider)
[providers.default]
type = "openai"
api_key = "env:OPENAI_API_KEY"
# base_url defaults to https://api.openai.com/v1

# Anthropic Claude
[providers.anthropic]
type = "anthropic"
api_key = "env:ANTHROPIC_API_KEY"
# base_url defaults to https://api.anthropic.com/v1

# Google Gemini
[providers.google]
type = "google"
api_key = "env:GEMINI_API_KEY"
# base_url defaults to https://generativelanguage.googleapis.com/v1beta

# Mistral AI
[providers.mistral]
type = "mistral"
api_key = "env:MISTRAL_API_KEY"
# base_url defaults to https://api.mistral.ai/v1

# Groq (fast inference)
[providers.groq]
type = "groq"
api_key = "env:GROQ_API_KEY"
# base_url defaults to https://api.groq.com/openai/v1

# xAI (Grok)
[providers.xai]
type = "xai"
api_key = "env:XAI_API_KEY"
# base_url defaults to https://api.x.ai/v1

# OpenRouter (unified API for many models)
[providers.openrouter]
type = "openrouter"
api_key = "env:OPENROUTER_API_KEY"
# base_url defaults to https://openrouter.ai/api/v1

# AWS Bedrock
[providers.bedrock]
type = "bedrock"
aws_region = "env:AWS_REGION"
aws_access_key_id = "env:AWS_ACCESS_KEY_ID"
aws_secret_access_key = "env:AWS_SECRET_ACCESS_KEY"
# aws_session_token = "env:AWS_SESSION_TOKEN"  # optional
# base_url defaults to https://bedrock-runtime.${aws_region}.amazonaws.com

# Azure OpenAI
[providers.azure]
type = "azure"
api_key = "env:AZURE_OPENAI_API_KEY"
base_url = "env:AZURE_OPENAI_ENDPOINT"  # e.g., https://your-resource.openai.azure.com/
api_version = "env:AZURE_OPENAI_API_VERSION"  # e.g., 2024-02-15-preview
# deployment = "my-gpt4-deployment"  # Optional: explicit deployment name
#
# URL construction:
#   - If deployment is set: uses that deployment name in the URL
#   - If deployment is not set: uses the model name from the request as deployment
#   - If base_url contains /openai/deployments/: uses the URL as-is

# Local Ollama
[providers.ollama]
type = "ollama"
base_url = "http://localhost:11434/v1"
# No API key needed for local Ollama

# Local vLLM (OpenAI-compatible)
[providers.vllm]
type = "openai-compatible"
base_url = "http://localhost:8000/v1"
api_key = "EMPTY"
[providers.vllm.compat]
supports_store = false
max_tokens_field = "max_tokens"

# =============================================================================
# Logging
# =============================================================================

[logging]
default = "stdout"

# Optional: Configure multiple logging backends
# Uncomment the backends you want to use:

# [[logging.backends]]
# type = "stdout"
# format = "json"  # or "pretty"

# [[logging.backends]]
# type = "file"
# path = "./logs/eavs.jsonl"
# rotate = "daily"  # or "size", "none"

# [[logging.backends]]
# type = "webhook"
# url = "https://your-logging-service.com/ingest"
# headers = { Authorization = "env:LOG_API_KEY" }
# batch_size = 100
# flush_interval_secs = 5

# [[logging.backends]]
# type = "otel"
# endpoint = "http://localhost:4317"
# protocol = "grpc"  # or "http"
# service_name = "eavs"

# =============================================================================
# Analysis
# =============================================================================

[analysis]
enabled = true
broadcast_channel_size = 1024

# Optional: Run analysis plugins (external processes).
# Each plugin receives JSONL AnalysisEvent records on stdin.
# Plugins can emit JSON commands on stdout:
#   {"type":"inject","conversation_id":"conv1","messages":[{"role":"system","content":"..."}]}
#   {"type":"clear","conversation_id":"conv1"}
#
# [[analysis.plugins]]
# name = "my-analyzer"
# command = "my-analyzer"
# args = ["--mode", "observe"]
# env = { MY_API_KEY = "env:MY_API_KEY" }

# =============================================================================
# Policy Engine
# =============================================================================
# Apply deny/rewrite/filter rules to requests before proxying upstream.
#
# [policy]
# enabled = true
#
# [[policy.rules]]
# action = "deny"
# model = "gpt-4*"
# reason = "This model family is disabled by local policy"
#
# [[policy.rules]]
# action = "rewrite_model"
# provider = "default"
# model = "gpt-4o-mini"
# to = "gpt-4o"
#
# [[policy.rules]]
# action = "filter_tools"
# deny = ["delete_*", "rm_*"]

# =============================================================================
# Conversation State
# =============================================================================

[state]
enabled = true
ttl_secs = 3600              # Conversations expire after 1 hour of inactivity
cleanup_interval_secs = 60   # Run cleanup every minute
max_conversations = 10000    # Max 10k concurrent conversations (0 = unlimited)

# =============================================================================
# Virtual API Keys
# =============================================================================
# Uncomment to enable virtual API key management with rate limiting and budgets.

# [keys]
# enabled = true
# database_path = "~/.eavs/keys.db"
# master_key = "env:EAVS_MASTER_KEY"   # Admin API key (supports env: syntax)
# allow_self_provisioning = false      # Allow creating keys without master key
# default_rpm_limit = 60               # Default requests per minute (omit for unlimited)
# default_budget_usd = 10.0            # Default budget in USD (omit for unlimited)
# update_pricing_on_startup = true     # Fetch latest model pricing on startup
#
# Path to word lists TOML file for human-readable key IDs (adjective-noun format).
# If not specified, downloads from eavs GitHub repo to XDG data directory:
# - Linux: ~/.local/share/eavs/word_lists.toml
# - macOS: ~/Library/Application Support/eavs/word_lists.toml
# word_lists_path = "~/.config/eavs/word_lists.toml"
