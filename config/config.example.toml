"$schema" = "https://raw.githubusercontent.com/byteowlz/schemas/refs/heads/main/eavs/eavs.config.schema.json"

# EAVS Configuration Example
#
# Copy this file to one of these locations:
#   - ~/.config/eavs/config.toml (global)
#   - ./eavs.toml (local, overrides global)
#
# Or specify explicitly:
#   - eavs serve --config /path/to/config.toml
#   - EAVS_CONFIG=/path/to/config.toml eavs serve

[server]
host = "127.0.0.1"
port = 3000

# =============================================================================
# Providers
# =============================================================================
# Configure multiple LLM providers. Use X-Provider header to select at runtime.
#
# API key values support three syntaxes:
#   "env:VAR_NAME"       -- read from environment variable
#   "keychain:account"   -- read from system keychain (macOS Keychain / libsecret / Windows Credential Manager)
#   "sk-..."             -- literal value (plaintext in config file)
#
# To store a key in the system keychain:
#   eavs secret set openai            # prompts for key interactively
#   eavs secret set openai --value sk-...
#
# Then reference it:
#   api_key = "keychain:openai"
#
# List configured keychain references and check availability:
#   eavs secret list --check

# OpenAI (default provider)
[providers.default]
type = "openai"
api_key = "env:OPENAI_API_KEY"
# Or use keychain: api_key = "keychain:openai"
# base_url defaults to https://api.openai.com/v1

# OpenAI Responses API (official /v1/responses)
[providers.openai_responses]
type = "openai-responses"
api_key = "env:OPENAI_API_KEY"
# base_url defaults to https://api.openai.com/v1

# Anthropic Claude
[providers.anthropic]
type = "anthropic"
api_key = "env:ANTHROPIC_API_KEY"
# base_url defaults to https://api.anthropic.com/v1
# For Claude Code OAuth, leave api_key empty and use OAuth (see OAuth section below).
#
# Optional: curated model shortlist for integrations (e.g., octo models.json generation).
# If omitted, a built-in default list is used based on provider type.
# [[providers.anthropic.models]]
# id = "claude-opus-4-6"
# name = "Claude Opus 4.6"
# reasoning = true
# input = ["text", "image"]
# context_window = 200000
# max_tokens = 32000
# cost = { input = 15.0, output = 75.0, cache_read = 1.875 }
#
# [[providers.anthropic.models]]
# id = "claude-sonnet-4-6"
# name = "Claude Sonnet 4.6"
# reasoning = true
# input = ["text", "image"]
# context_window = 200000
# max_tokens = 16384
# cost = { input = 3.0, output = 15.0, cache_read = 0.3 }

# OpenAI Codex (ChatGPT backend via OAuth)
[providers.codex]
type = "openai-codex"
# OAuth tokens are stored in the key database (requires keys.enabled = true).
# base_url defaults to https://chatgpt.com/backend-api

# Google Gemini
[providers.google]
type = "google"
api_key = "env:GEMINI_API_KEY"
# base_url defaults to https://generativelanguage.googleapis.com/v1beta

# Google Vertex AI (uses Application Default Credentials or API key)
# [providers.vertex]
# type = "google-vertex"
# api_key = "env:GEMINI_API_KEY"           # or use ADC: gcloud auth application-default login
# gcp_project = "env:GOOGLE_CLOUD_PROJECT" # required
# gcp_location = "env:GOOGLE_CLOUD_LOCATION" # required (e.g., "us-central1")
# base_url defaults to https://{gcp_location}-aiplatform.googleapis.com

# Google Gemini CLI / Cloud Code Assist (free tier, uses OAuth)
# [providers.gemini-cli]
# type = "google-gemini-cli"
# OAuth tokens are stored in the key database (requires keys.enabled = true).
# base_url defaults to https://cloudcode-pa.googleapis.com
# Also supports "google-antigravity" type alias.

# GitHub Copilot (device code flow OAuth)
# [providers.copilot]
# type = "github-copilot"
# OAuth tokens are stored in the key database (requires keys.enabled = true).
# Uses device code flow: `eavs login github-copilot`
# base_url is dynamically determined from the Copilot API token.
# Requires Copilot headers (automatically injected by EAVS).

# Mistral AI
[providers.mistral]
type = "mistral"
api_key = "env:MISTRAL_API_KEY"
# base_url defaults to https://api.mistral.ai/v1

# Groq (fast inference)
[providers.groq]
type = "groq"
api_key = "env:GROQ_API_KEY"
# base_url defaults to https://api.groq.com/openai/v1

# xAI (Grok)
[providers.xai]
type = "xai"
api_key = "env:XAI_API_KEY"
# base_url defaults to https://api.x.ai/v1

# =============================================================================
# Azure AI Foundry
# =============================================================================
# Azure AI Foundry hosts models from multiple providers (OpenAI, Anthropic, etc.).
# Configure each model type using the appropriate provider type.
#
# IMPORTANT: Different model families use different API formats:
#   - OpenAI models (GPT-4o, o1, etc.) -> use type = "openai"
#   - Anthropic models (Claude)        -> use type = "anthropic"
#   - Other OpenAI-compatible models   -> use type = "openai-compatible"

# --- Azure AI Foundry: OpenAI models (GPT-4o, o1, o3, gpt-4.1, etc.) ---
# Uses the new v1 API format (no api-version parameter needed)
# [providers.foundry-openai]
# type = "openai"
# api_key = "env:AZURE_FOUNDRY_API_KEY"
# base_url = "https://{resource}.services.ai.azure.com/openai/v1"
#
# Example:
# base_url = "https://my-resource.services.ai.azure.com/openai/v1"

# --- Azure AI Foundry: Anthropic/Claude models ---
# Uses Anthropic Messages API format with x-api-key header
# [providers.foundry-claude]
# type = "anthropic"
# api_key = "env:AZURE_FOUNDRY_API_KEY"
# base_url = "https://{resource}.openai.azure.com/anthropic/v1"
#
# Example:
# base_url = "https://my-resource.openai.azure.com/anthropic/v1"
#
# Usage:
#   curl http://localhost:3000/v1/chat/completions \
#     -H "X-Provider: foundry-claude" \
#     -d '{"model": "claude-opus-4-5", "messages": [...]}'

# --- Azure AI Foundry: Other models (DeepSeek, Llama, Phi, etc.) ---
# Most use OpenAI-compatible format
# [providers.foundry-deepseek]
# type = "openai-compatible"
# api_key = "env:AZURE_FOUNDRY_API_KEY"
# base_url = "https://{resource}.services.ai.azure.com/openai/v1"
# [providers.foundry-deepseek.compat]
# supports_store = false
# max_tokens_field = "max_tokens"
# supports_stream_options = false       # set false if provider rejects stream_options
# supports_developer_role = false       # set false if provider doesn't support developer role

# OpenRouter (unified API for many models)
[providers.openrouter]
type = "openrouter"
api_key = "env:OPENROUTER_API_KEY"
# base_url defaults to https://openrouter.ai/api/v1

# AWS Bedrock
[providers.bedrock]
type = "bedrock"
aws_region = "env:AWS_REGION"
aws_access_key_id = "env:AWS_ACCESS_KEY_ID"
aws_secret_access_key = "env:AWS_SECRET_ACCESS_KEY"
# aws_session_token = "env:AWS_SESSION_TOKEN"  # optional
# base_url defaults to https://bedrock-runtime.${aws_region}.amazonaws.com

# Azure OpenAI
[providers.azure]
type = "azure"
api_key = "env:AZURE_OPENAI_API_KEY"
base_url = "env:AZURE_OPENAI_ENDPOINT"       # e.g., https://your-resource.openai.azure.com/
api_version = "env:AZURE_OPENAI_API_VERSION" # e.g., 2024-02-15-preview
# deployment = "my-gpt4-deployment"  # Optional: explicit deployment name
#
# URL construction:
#   - If deployment is set: uses that deployment name in the URL
#   - If deployment is not set: uses the model name from the request as deployment
#   - If base_url contains /openai/deployments/: uses the URL as-is

# Local Ollama
[providers.ollama]
type = "ollama"
base_url = "http://localhost:11434/v1"
# No API key needed for local Ollama
test_model = "llama3.2"  # Model to use for `eavs setup test` / `eavs setup test-all`

# Local vLLM (OpenAI-compatible)
[providers.vllm]
type = "openai-compatible"
base_url = "http://localhost:8000/v1"
api_key = "EMPTY"
test_model = "my-model"  # Model to use for `eavs setup test` / `eavs setup test-all`
[providers.vllm.compat]
supports_store = false
max_tokens_field = "max_tokens"
supports_stream_options = false

# =============================================================================
# Test Model Resolution
# =============================================================================
# When running `eavs setup test` or `eavs setup test-all`, EAVS picks a model
# to test with using this precedence:
#
#   1. `test_model` field in the provider config (shown above)
#   2. First matching model from ~/.pi/agent/models.json (matched by base_url)
#   3. Built-in default for the provider type (e.g., gpt-4o-mini for OpenAI)

# =============================================================================
# Logging
# =============================================================================

[logging]
default = "stdout"

# Optional: Configure multiple logging backends
# Uncomment the backends you want to use:

# [[logging.backends]]
# type = "stdout"
# format = "json"  # or "pretty"

# [[logging.backends]]
# type = "file"
# path = "./logs/eavs.jsonl"
# rotate = "daily"  # or "size", "none"

# [[logging.backends]]
# type = "webhook"
# url = "https://your-logging-service.com/ingest"
# headers = { Authorization = "env:LOG_API_KEY" }
# batch_size = 100
# flush_interval_secs = 5

# [[logging.backends]]
# type = "otel"
# endpoint = "http://localhost:4317"
# protocol = "grpc"  # or "http"
# service_name = "eavs"

# =============================================================================
# Analysis
# =============================================================================

[analysis]
enabled = true
broadcast_channel_size = 1024

# Optional: Run analysis plugins (external processes).
# Each plugin receives JSONL AnalysisEvent records on stdin.
# Plugins can emit JSON commands on stdout:
#   {"type":"inject","conversation_id":"conv1","messages":[{"role":"system","content":"..."}]}
#   {"type":"clear","conversation_id":"conv1"}
#
# [[analysis.plugins]]
# name = "my-analyzer"
# command = "my-analyzer"
# args = ["--mode", "observe"]
# env = { MY_API_KEY = "env:MY_API_KEY" }

# =============================================================================
# Policy Engine
# =============================================================================
# Apply deny/rewrite/filter rules to requests before proxying upstream.
#
# [policy]
# enabled = true
#
# [[policy.rules]]
# action = "deny"
# model = "gpt-4*"
# reason = "This model family is disabled by local policy"
#
# [[policy.rules]]
# action = "rewrite_model"
# provider = "default"
# model = "gpt-4o-mini"
# to = "gpt-4o"
#
# [[policy.rules]]
# action = "filter_tools"
# deny = ["delete_*", "rm_*"]
#
# [[policy.rules]]
# action = "set_field"
# model = "gpt-5*"
# path = "/v1/responses"
# field = "store"
# value = true

# =============================================================================
# Conversation State
# =============================================================================

[state]
enabled = true
capture_all = false        # Track all conversations (not just those with injections)
ttl_secs = 3600            # Conversations expire after 1 hour of inactivity
cleanup_interval_secs = 60 # Run cleanup every minute
max_conversations = 10000  # Max 10k concurrent conversations (0 = unlimited)

# =============================================================================
# Virtual API Keys
# =============================================================================
# Uncomment to enable virtual API key management with rate limiting and budgets.

# [keys]
# enabled = true
# require_key = true                   # Require a valid virtual key for all requests
# database_path = "~/.eavs/keys.db"
# master_key = "env:EAVS_MASTER_KEY"   # Admin API key (supports env: syntax)
# allow_self_provisioning = false      # Allow creating keys without master key
# default_rpm_limit = 60               # Default requests per minute (omit for unlimited)
# default_budget_usd = 10.0            # Default budget in USD (omit for unlimited)
# update_pricing_on_startup = true     # Fetch latest model pricing on startup
#
# Path to word lists TOML file for human-readable key IDs (adjective-noun format).
# If not specified, downloads from eavs GitHub repo to XDG data directory:
# - Linux: ~/.local/share/eavs/word_lists.toml
# - macOS: ~/Library/Application Support/eavs/word_lists.toml
# word_lists_path = "~/.config/eavs/word_lists.toml"

#
# OAuth credential storage backend: "keychain" (default) or "sqlite".
# "keychain" uses the system keychain:
#   - macOS: Keychain
#   - Linux: D-Bus Secret Service (gnome-keyring / libsecret)
#   - Windows: Credential Manager
#   Falls back to SQLite automatically if the keychain is unavailable.
# "sqlite" stores tokens in the same database as virtual API keys (plaintext).
# oauth_backend = "keychain"

# =============================================================================
# OAuth (Claude Code + OpenAI Codex)
# =============================================================================
# OAuth credentials are configured via environment variables (not in config):
#   - EAVS_OAUTH_REDIRECT_URI (required)
#   - EAVS_OAUTH_ANTHROPIC_CLIENT_ID / _SECRET / _SCOPE
#   - EAVS_OAUTH_OPENAI_CLIENT_ID / _SECRET / _SCOPE
#
# OAuth tokens are stored securely via the configured backend (see oauth_backend above).
# Requires [keys].enabled = true.

# =============================================================================
# Transparent Traffic Capture (via mitmproxy)
# =============================================================================
# Enable automatic transparent interception of LLM API traffic.
# This requires mitmproxy 10.1.5+ to be installed.
#
# When enabled, Eaves will automatically start mitmproxy with the
# eavs_capture.py addon to intercept traffic from:
#   - API calls (api.openai.com, api.anthropic.com, etc.)
#   - Desktop apps (ChatGPT, Claude, etc.)
#
# Install mitmproxy:
#   macOS:   brew install mitmproxy
#   Windows: winget install mitmproxy
#   Linux:   pip install mitmproxy
#
# On first run, you may need to trust mitmproxy's CA certificate.
# See: https://docs.mitmproxy.org/stable/concepts/certificates/

# [capture]
# enabled = false                        # Enable transparent capture mode
# mitmproxy_path = "mitmdump"            # Path to mitmdump executable (use mitmdump, not mitmproxy, for background use)
# mode = "local"                         # Capture mode: "local" for all traffic, "local:AppName" for specific app
# verbose = false                        # Enable verbose logging from mitmproxy addon
# api_only = false                       # Only capture API traffic (skip desktop app domains)
# addon_path = "/path/to/eavs_capture.py"  # Custom path to addon script (usually auto-detected)
# extra_args = []                        # Additional mitmproxy arguments (e.g., ["--quiet"])

# =============================================================================
# Transform Plugins
# =============================================================================
# Transform plugins are external scripts that can modify request/response JSON
# before/after it's sent to upstream providers. This is useful for:
#   - Provider-specific quirks (e.g., OAuth token restrictions)
#   - Custom header injection
#   - Request/response logging and modification
#
# Plugin Protocol:
# Plugins receive JSON on stdin:
#   {
#     "type": "request" | "response",
#     "provider": "anthropic" | "openai" | ...,
#     "is_oauth": true | false,
#     "headers": { "header-name": "value", ... },
#     "body": { ... request/response body ... }
#   }
#
# Plugins output modified JSON on stdout:
#   {
#     "headers": { "header-name": "value", ... },  // optional
#     "body": { ... modified body ... }            // optional
#   }

# [transform]
# enabled = true
#
# [[transform.plugins]]
# name = "anthropic-oauth-fix"
# command = "my-transform-script"
# args = ["--mode", "transform"]
# env = { MY_API_KEY = "env:MY_API_KEY" }
# providers = ["anthropic"]  # Only run for Anthropic (empty = all providers)
# oauth_only = true          # Only run for OAuth requests
# timeout_ms = 5000          # 5 second timeout (default)

# === Network Access Control ===
# Controls which upstream domains the proxy can connect to.
# Deny list is checked first (block), then allow list (restrict).
# Empty lists = no restriction for that list.

# [network]
# allow_domains = ["api.openai.com", "*.anthropic.com", "api.groq.com", "generativelanguage.googleapis.com"]
# deny_domains = ["*.internal.corp", "evil.com"]
# block_private_ips = true  # Block 127.x, 10.x, 172.16-31.x, 192.168.x, localhost (default: true)
