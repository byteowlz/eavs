# yaml-language-server: $schema=../config/config.schema.json
# EAVS example configuration (copy and customize)
#
# Default config discovery:
#   1. --config PATH / EAVS_CONFIG
#   2. EAVS_* env vars (EAVS_SERVER__PORT=..., etc.)
#   3. ./eavs.toml (local)
#   4. ~/.config/eavs/config.toml (global)

[server]
host = "127.0.0.1"
port = 3000

[providers.default]
type = "openai"
api_key = "env:OPENAI_API_KEY"

[providers.azure]
type = "azure"
api_key = "env:AZURE_OPENAI_KEY"
base_url = "https://your-resource.openai.azure.com/openai/deployments/your-deployment"
api_version = "2024-02-15-preview"

[logging]
default = "stdout"

[analysis]
enabled = true
broadcast_channel_size = 1024

[state]
enabled = true
ttl_secs = 3600
cleanup_interval_secs = 60
max_conversations = 10000
